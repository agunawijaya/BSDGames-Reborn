    document.addEventListener('keydown', (e) => {
      if (game.state !== 'playing') {
        if (game.canRestart) { restartGame(); e.preventDefault(); }
        return;
      }

      const k = e.key.toLowerCase();
      let dx = 0, dy = 0, valid = false;
      if (k === 'arrowright' || k === 'd') { dx = 1;  dy = 0;  valid = true; }
      else if (k === 'arrowleft' || k === 'a') { dx = -1; dy = 0;  valid = true; }
      else if (k === 'arrowup' || k === 'w') { dx = 0;  dy = -1; valid = true; }
      else if (k === 'arrowdown' || k === 's') { dx = 0;  dy = 1;  valid = true; }
      if (!valid) return;
      e.preventDefault();

      // Nokia-snake input buffer — queue up to 2 turns so rapid double-taps
      // both register in sequence.
      // Reverse/no-op checks are against the LAST INTENT (last queued if any,
      // else the currently-committed direction), not the committed direction.
      // This lets you press ↑ then ← quickly and both turns happen on
      // successive ticks — instead of the ← being rejected as reverse of
      // the pre-turn "right".
      const lastIntent = worm.directionQueue.length > 0
        ? worm.directionQueue[worm.directionQueue.length - 1]
        : worm.direction;
      if (dx === -lastIntent.dx && dy === -lastIntent.dy) return;   // 180° block
      if (dx ===  lastIntent.dx && dy ===  lastIntent.dy) return;   // no-op
      if (worm.directionQueue.length >= 2) return;                  // cap depth
      worm.directionQueue.push({ dx, dy });
    });

    // ================= TICK LOGIC (BSD spec) =================
    function doTick() {
      if (game.state !== 'playing') return;

      // TURN ACCURACY: move FIRST in current direction, then commit pending
      // direction at end of tick. Turn visually happens at the cell the eye
      // reached (not at the neck).
      //
      // INPUT RESCUE: if moving in current direction WOULD kill (wall or self)
      // AND the pending direction differs, commit pending NOW instead. This
      // preserves player intent when they press turn late — e.g. right after
      // eating an apple at the edge — instead of dying on a stale direction.
      // Rescue only fires in the death-adjacent case, so normal turns still
      // land at the eye position.

      const oldHead = worm.segments[0];

      function isDeadly(cell) {
        if (cell.x < 0 || cell.x >= GRID.cols ||
            cell.y < 0 || cell.y >= GRID.rows) return true;
        const willShrinkTail = worm.growing === 0;
        const checkUntil = willShrinkTail
          ? worm.segments.length - 1
          : worm.segments.length;
        for (let i = 0; i < checkUntil; i++) {
          if (worm.segments[i].x === cell.x &&
              worm.segments[i].y === cell.y) return true;
        }
        return false;
      }

      const currDir = worm.direction;
      const pendDir = worm.directionQueue.length > 0
        ? worm.directionQueue[0]
        : currDir;
      const pendingDiffers =
        (pendDir.dx !== currDir.dx) || (pendDir.dy !== currDir.dy);

      let newHead = { x: oldHead.x + currDir.dx, y: oldHead.y + currDir.dy };

      if (pendingDiffers && isDeadly(newHead)) {
        // Input rescue — pull the queued turn forward to honor player intent
        worm.direction = pendDir;
        worm.directionQueue.shift();
        newHead = { x: oldHead.x + pendDir.dx, y: oldHead.y + pendDir.dy };
      }

      // Death: wall (may still fire if rescue direction is also deadly)
      if (newHead.x < 0 || newHead.x >= GRID.cols ||
          newHead.y < 0 || newHead.y >= GRID.rows) {
        return triggerDeath('wall');
      }

      // Death: self collision (rescue direction re-checked here too)
      {
        const willShrinkTail = worm.growing === 0;
        const checkUntil = willShrinkTail
          ? worm.segments.length - 1
          : worm.segments.length;
        for (let i = 0; i < checkUntil; i++) {
          if (worm.segments[i].x === newHead.x &&
              worm.segments[i].y === newHead.y) {
            return triggerDeath('self');
          }
        }
      }

      // Add new head
      worm.segments.unshift(newHead);

      // Eat apple? — check BEFORE tail resolution, matches BSD source
      for (let ai = 0; ai < apples.length; ai++) {
        const a = apples[ai];
        if (newHead.x === a.x && newHead.y === a.y) {
          worm.growing += a.value;                 // BSD: growing += ch - '0'
          spawnPickupBurst(a.x, a.y, a.value);
          game.score += worm.growing;               // BSD: score += growing (chained bonus!)
          updateScoreDisplay();
          apples.splice(ai, 1);
          respawnAfterEat();                        // Pure=instant, Wild=delayed 2.5s
          break;
        }
      }

      // Frog bonus?
      if (frog.active && newHead.x === frog.x && newHead.y === frog.y) {
        game.score += FROG_SCORE;
        spawnFrogEatBurst(frog.x, frog.y);
        updateScoreDisplay();
        despawnFrog(performance.now());
      }

      // Tail resolution
      if (worm.growing === 0) {
        worm.segments.pop();
      } else {
        worm.growing--;
      }

      // Update progressive speed after growth
      if (settings.speed === 'progressive') updateTickInterval();
      updateLengthDisplay();

      // Win check (fill entire grid)
      if (worm.segments.length >= GRID.cols * GRID.rows - 1) {
        triggerWin();
      }

      // Commit pending direction for NEXT tick (turn accuracy fix)
      // Consume next queued turn (Nokia-snake buffer) — one per tick, so a
      // double-tap plays back as two sequential turns.
      if (worm.directionQueue.length > 0) {
        worm.direction = worm.directionQueue.shift();
      }
    }

    // ================= DEATH / WIN =================
    function triggerDeath(reason) {
      if (game.state !== 'playing') return;
      game.state = 'dead';
      game.overOffTime = 0;
      game.canRestart = false;
      const head = worm.segments[0];
      spawnDeathBurst(head.x, head.y);
      if (game.score > game.bestScore) {
        game.bestScore = game.score;
        try { localStorage.setItem(BEST_KEY, String(game.bestScore)); } catch(e) {}
        updateScoreDisplay();
      }
      let sub;
      if (reason === 'wall')          sub = 'crashed into the wall';
      else if (reason === 'wasp')     sub = 'stung by a wasp';
      else if (reason === 'gardener') sub = 'trampled by the gardener';
      else                            sub = 'tangled with your own body';
      showOverlay('dead', 'CAUGHT', sub, 'press any key');
    }

    function triggerWin() {
      if (game.state !== 'playing') return;
      game.state = 'won';
      game.overOffTime = 0;
      game.canRestart = false;
      if (game.score > game.bestScore) {
        game.bestScore = game.score;
        try { localStorage.setItem(BEST_KEY, String(game.bestScore)); } catch(e) {}
        updateScoreDisplay();
      }
      showOverlay('win', 'GARDEN FILLED', `${game.score} chained points`, 'press any key');
    }

    function showOverlay(cls, title, sub, instr) {
      gameOverlay.innerHTML = `
        <div class="go-title ${cls}">${title}</div>
        <div class="go-sub">${sub}</div>
        <div class="go-instr">${instr}</div>
      `;
      setTimeout(() => gameOverlay.classList.add('visible'), 40);
      setTimeout(() => { game.canRestart = true; }, 550);
    }
    function hideOverlay() {
      gameOverlay.classList.remove('visible');
      gameOverlay.innerHTML = '';
    }

    function updateScoreDisplay() {
      scoreLabel.textContent = game.score;
      bestLabel.textContent = game.bestScore;
    }
    function updateLengthDisplay() {
      lengthLabel.textContent = worm.segments.length;
    }

    function restartGame() {
      game.state = 'playing';
      game.score = 0;
      hideOverlay();
      initWorm();
      initApples();
      frog.active = false;
      bird.active = false;
      wasps.length = 0;
      gardener.active = false;
      scheduleNextFrog(performance.now());
      scheduleNextBird(performance.now());
      scheduleNextGardener(performance.now());
      particles.length = 0;
      updateScoreDisplay();
      updateLengthDisplay();
      updateTickInterval();
    }

    // ================= APPLE + PARTICLE UPDATES =================
    function updateApples(dt) {
      for (const a of apples) {
        a.spin += dt * 0.003;
        a.bob  += dt * 0.0022;
      }
    }

    function spawnFrogEatBurst(gx, gy) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2 + Math.random() * 0.3;
        const s = 120 + Math.random() * 200;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 850,
          maxLife: 850,
          color: i % 3 === 0 ? '#ffd044' : (i % 3 === 1 ? '#7cf248' : '#ffffff'),
          size: 2 + Math.random() * 1.6,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 700, maxLife: 700,
        ring: true, radius: 5,
        color: '#ffd044',
      });
    }

    // ================= PARTICLES =================
    const particles = [];
    function spawnPickupBurst(gx, gy, value) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      const count = 10 + value * 2;                 // bigger apple → more particles
      const bodyColor = appleColorForValue(value);
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + Math.random() * 0.3;
        const s = 60 + Math.random() * 120 + value * 8;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 550 + value * 30,
          maxLife: 550 + value * 30,
          color: i % 2 === 0 ? bodyColor : T.appleGlow,
          size: 2 + Math.random() * 1.2,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 400, maxLife: 400,
        ring: true, radius: 4,
        color: bodyColor,
      });
    }
    function spawnDeathBurst(gx, gy) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      for (let i = 0; i < 30; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 90 + Math.random() * 200;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 900, maxLife: 900,
          color: i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? T.wormHead : T.wormBody),
          size: 2 + Math.random() * 2,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 700, maxLife: 700,
        ring: true, radius: 6,
        color: '#ffffff',
      });
    }
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        const dtSec = dt / 1000;
        if (p.ring) {
          p.radius += 200 * dtSec;
        } else {
          p.x += p.vx * dtSec;
          p.y += p.vy * dtSec;
          p.vx *= Math.pow(0.05, dtSec);
          p.vy *= Math.pow(0.05, dtSec);
        }
      }
    }
    function renderParticles() {
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const a = p.life / p.maxLife;
        if (p.ring) {
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = a * 0.8;
          ctx.lineWidth = 3 * a;
          ctx.shadowBlur = 12; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = a;
          ctx.shadowBlur = 10; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // ================= AMBIENT DRIFT =================
    const drift = [];
    for (let i = 0; i < 40; i++) {
      drift.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: -6 - Math.random() * 12,
        vy: (Math.random() - 0.5) * 4,
        r: 0.6 + Math.random() * 1.2,
        hueIdx: Math.random() < 0.6 ? 0 : 1,
        phase: Math.random() * Math.PI * 2,
      });
    }
    const stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.9,
        r: 0.5 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.001 + Math.random() * 0.003,
      });
    }
    function updateDrift(dt) {
      const dtSec = dt / 1000;
      for (const d of drift) {
        if (T.risingParticles) {
          d.x += Math.sin(d.phase + performance.now() * 0.001) * 8 * dtSec;
          d.y -= (30 + d.r * 10) * dtSec;
          if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
        } else if (T.sandBlow) {
          d.x += d.vx * 2.2 * dtSec;
          d.y += d.vy * 0.4 * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
        } else {
          d.x += d.vx * dtSec;
          d.y += d.vy * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
          if (d.y < -10) d.y = H + 10;
          if (d.y > H + 10) d.y = -10;
        }
      }
    }

    // ================= OFFSCREEN STATIC LAYER =================
    let staticLayer = null;
    let staticLayerTheme = null;
    function invalidateStaticLayer() {
      staticLayer = null;
      staticLayerTheme = null;
    }
    function ensureStaticLayer() {
      if (staticLayer && staticLayerTheme === currentTheme) return;
      staticLayer = document.createElement('canvas');
      staticLayer.width = W;
      staticLayer.height = H;
      renderStaticLayer(staticLayer.getContext('2d'));
      staticLayerTheme = currentTheme;
    }
    function renderStaticLayer(sctx) {
      // Base bg
      if (T.bgGradient) {
        const g = sctx.createLinearGradient(0, 0, 0, H);
        for (const stop of T.bgGradient) g.addColorStop(stop.pos, stop.color);
        sctx.fillStyle = g;
      } else {
        sctx.fillStyle = T.bg;
      }
      sctx.fillRect(0, 0, W, H);

      // Vignette
      const vg = sctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W*0.7);
      vg.addColorStop(0, T.vignette);
      vg.addColorStop(1, 'rgba(0,0,0,0)');
      sctx.fillStyle = vg;
      sctx.fillRect(0, 0, W, H);

      // Grid lines (aligned with GRID.cellSize)
      sctx.strokeStyle = T.gridLine;
      sctx.lineWidth = 1;
      sctx.beginPath();
      for (let x = GRID.cellSize; x < W; x += GRID.cellSize) {
        sctx.moveTo(x + 0.5, 0);
        sctx.lineTo(x + 0.5, H);
      }
      for (let y = GRID.cellSize; y < H; y += GRID.cellSize) {
        sctx.moveTo(0, y + 0.5);
        sctx.lineTo(W, y + 0.5);
      }
      sctx.stroke();

      // Grid intersection dots
      sctx.save();
      if (T.composite === 'lighter') sctx.globalCompositeOperation = 'lighter';
      sctx.fillStyle = T.gridDot;
      if (T.gridDotGlow > 0) {
        sctx.shadowBlur = T.gridDotGlow;
        sctx.shadowColor = T.gridDot;
      }
      for (let x = GRID.cellSize; x < W; x += GRID.cellSize) {
        for (let y = GRID.cellSize; y < H; y += GRID.cellSize) {
          sctx.beginPath();
          sctx.arc(x, y, 1.2, 0, Math.PI * 2);
          sctx.fill();
        }
      }
      sctx.restore();

      // Wall frame — emphasize the deadly boundary with a strong border
      sctx.save();
      sctx.strokeStyle = T.gridDot;
      sctx.lineWidth = 3;
      if (T.gridDotGlow > 0) {
        sctx.shadowBlur = T.gridDotGlow * 2;
        sctx.shadowColor = T.gridDot;
      }
      sctx.strokeRect(1.5, 1.5, W - 3, H - 3);
      sctx.restore();

      // Moon crescent for Midnight
      if (T.stars) {
        const moonX = W - 80, moonY = 80, moonR = 24;
        const coverX = moonX + 10, coverY = moonY - 4, coverR = 22;
        sctx.save();
        sctx.beginPath();
        sctx.rect(0, 0, W, H);
        sctx.arc(coverX, coverY, coverR, 0, Math.PI * 2, true);
        sctx.clip('evenodd');
        sctx.shadowBlur = 30;
        sctx.shadowColor = 'rgba(240,235,220,0.7)';
        sctx.fillStyle = 'rgba(240,235,220,0.95)';
        sctx.beginPath();
        sctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        sctx.fill();
        sctx.restore();
      }
    }

    // ================= APPLE COLOR =================
    function appleColorForValue(v) {
      const t = (v - 1) / 8;   // 0..1
      return lerpColor(T.appleBase, T.appleRipe, t);
    }

    // ================= RENDERING =================
    function renderBackground(time) {
      ensureStaticLayer();
      ctx.drawImage(staticLayer, 0, 0);

      // Stars
      if (T.stars) {
        ctx.save();
        for (const s of stars) {
          const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(time * s.twinkleSpeed + s.phase));
          ctx.fillStyle = `rgba(255,255,220,${twinkle})`;
          ctx.shadowBlur = 4;
          ctx.shadowColor = '#ffeecc';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * twinkle, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Drift particles
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const d of drift) {
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.002 + d.phase);
        const color = T.driftColors[d.hueIdx].replace('ALPHA', (0.25 * pulse).toFixed(2));
        ctx.fillStyle = color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderApples(time) {
      for (const a of apples) renderApple(a, time);
    }

    function renderApple(apple, time) {
      const cellSize = GRID.cellSize;
      const cx = (apple.x + 0.5) * cellSize;
      const cy = (apple.y + 0.5) * cellSize;
      const bob = Math.sin(apple.bob) * 2;

      // Size scales with value (0.55 to 1.0 of cellSize/2)
      const sizeFactor = 0.55 + (apple.value / 9) * 0.45;
      const r = (cellSize / 2 - 3) * sizeFactor;

      let bodyColor = appleColorForValue(apple.value);
      // Rotten visual state: desaturated + darker
      if (apple.state === 'rotten') {
        bodyColor = darkenColor(bodyColor, 0.45);
      }
      const bodyLight = lightenColor(bodyColor, 0.35);
      const bodyDark = darkenColor(bodyColor, 0.35);

      ctx.save();
      ctx.translate(cx, cy + bob);
      const spin = Math.sin(apple.spin);

      // Ground shadow (soft ellipse)
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.filter = 'blur(3px)';
      ctx.beginPath();
      ctx.ellipse(0, r + 4, r * 0.9, r * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Apple body with radial gradient
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      ctx.shadowBlur = 18;
      ctx.shadowColor = T.appleGlow;

      const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 1, 0, 0, r * 1.4);
      bodyGrad.addColorStop(0, bodyLight);
      bodyGrad.addColorStop(0.55, bodyColor);
      bodyGrad.addColorStop(1, bodyDark);
      ctx.fillStyle = bodyGrad;

      // Proper apple silhouette (stem well + calyx)
      const w = r * 1.02, h = r;
      ctx.beginPath();
      ctx.moveTo(-r * 0.2, -h + 1);
      ctx.quadraticCurveTo(-r * 0.1, -h + 2.5, 0, -h + 1.8);
      ctx.quadraticCurveTo(r * 0.1, -h + 2.5, r * 0.2, -h + 1);
      ctx.bezierCurveTo(r * 0.6, -h + 0.5, w * 0.95, -h * 0.55, w, -h * 0.15);
      ctx.bezierCurveTo(w * 1.05, h * 0.4, w * 0.6, h * 0.95, w * 0.3, h * 0.92);
      ctx.quadraticCurveTo(w * 0.1, h * 1.05, 0, h * 0.90);
      ctx.quadraticCurveTo(-w * 0.1, h * 1.05, -w * 0.3, h * 0.92);
      ctx.bezierCurveTo(-w * 0.6, h * 0.95, -w * 1.05, h * 0.4, -w, -h * 0.15);
      ctx.bezierCurveTo(-w * 0.95, -h * 0.55, -r * 0.6, -h + 0.5, -r * 0.2, -h + 1);
      ctx.closePath();
      ctx.fill();

      // Highlight
      ctx.save();
      ctx.shadowBlur = 0;
      const hlGrad = ctx.createRadialGradient(-r * 0.35 + spin, -r * 0.4, 0, -r * 0.35 + spin, -r * 0.4, r * 0.5);
      hlGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
      hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hlGrad;
      ctx.beginPath();
      ctx.ellipse(-r * 0.3 + spin, -r * 0.35, r * 0.25, r * 0.4, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Specular dot
      ctx.save();
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.arc(-r * 0.35 + spin, -r * 0.5, r * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Stem
      ctx.save();
      ctx.strokeStyle = T.appleStem;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -h + 1);
      ctx.quadraticCurveTo(r * 0.15, -h - 2, r * 0.3, -h - 3);
      ctx.stroke();
      ctx.restore();

      // Leaf
      ctx.save();
      ctx.translate(r * 0.3, -h - 3);
      ctx.rotate(-0.5);
      const leafGrad = ctx.createLinearGradient(0, -0.5, r * 0.5, 0.5);
      leafGrad.addColorStop(0, lightenColor(T.appleLeaf, 0.2));
      leafGrad.addColorStop(1, darkenColor(T.appleLeaf, 0.2));
      ctx.fillStyle = leafGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0.3);
      ctx.quadraticCurveTo(r * 0.25, -r * 0.3, r * 0.55, -r * 0.1);
      ctx.quadraticCurveTo(r * 0.65, 0, r * 0.5, r * 0.1);
      ctx.quadraticCurveTo(r * 0.25, r * 0.2, 0, 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,40,10,0.4)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(r * 0.5, -0.1);
      ctx.stroke();
      ctx.restore();

      // The DIGIT — big centered, with glow
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = 'source-over';
      const digitSize = r * 1.35;
      ctx.font = `900 ${digitSize}px 'JetBrains Mono', 'Fira Code', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Text shadow for readability
      ctx.fillStyle = T.appleDigitShadow;
      ctx.fillText(String(apple.value), 1, 1);
      ctx.fillStyle = T.appleDigit;
      ctx.fillText(String(apple.value), 0, 0);
      ctx.restore();

      // Rot indicator: subtle dark stipple pattern on top
      if (apple.state === 'rotten') {
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(60,30,10,0.35)';
        for (let i = 0; i < 5; i++) {
          const ang = (i / 5) * Math.PI * 2 + Math.sin(apple.spin) * 0.2;
          const rr = r * 0.55;
          ctx.beginPath();
          ctx.arc(Math.cos(ang) * rr, Math.sin(ang) * rr, r * 0.10, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      ctx.restore();
    }

    // ================= FROG RENDER =================
    function renderFrog(now) {
      if (!frog.active) return;
      const cellSize = GRID.cellSize;

      // Compute position + arc + body transforms per state
      let cx, cy, arc = 0;
      let bodyScaleX = 1, bodyScaleY = 1;
      let legExtend = 0;     // 0 = folded (sitting), 1 = fully extended (mid-jump)
      let headTilt = 0;      // slight tilt during jump for expression
      let facingDx = 0, facingDy = 0;
      const age = now - frog.stateStart;

      switch (frog.state) {
        case 'sitting': {
          cx = (frog.x + 0.5) * cellSize;
          cy = (frog.y + 0.5) * cellSize;
          // Subtle breathing: body scales +/- 3% over ~2s cycle
          const breathe = Math.sin((now - frog.spawnTime) * 0.003);
          bodyScaleY = 1 + breathe * 0.03;
          bodyScaleX = 1 - breathe * 0.02;
          legExtend = 0;
          break;
        }
        case 'crouching': {
          cx = (frog.x + 0.5) * cellSize;
          cy = (frog.y + 0.5) * cellSize;
          // Squish down: gathering power for jump
          const ct = Math.min(1, age / FROG_CROUCH_MS);
          bodyScaleY = 1 - ct * 0.30;
          bodyScaleX = 1 + ct * 0.18;
          legExtend = -ct * 0.3;   // legs fold further
          facingDx = frog.targetX - frog.x;
          facingDy = frog.targetY - frog.y;
          break;
        }
        case 'airborne': {
          const jt = Math.min(1, age / FROG_JUMP_MS);
          cx = ((frog.fromX + 0.5) + (frog.x - frog.fromX) * jt) * cellSize;
          cy = ((frog.fromY + 0.5) + (frog.y - frog.fromY) * jt) * cellSize;
          arc = -Math.sin(jt * Math.PI) * cellSize * FROG_JUMP_HEIGHT_CELLS;
          // Stretch during flight (peak in middle)
          const stretch = Math.sin(jt * Math.PI);
          bodyScaleY = 1 + stretch * 0.22;
          bodyScaleX = 1 - stretch * 0.10;
          legExtend = stretch;            // legs trail back and out
          headTilt = -stretch * 0.15;     // head slightly up mid-jump
          facingDx = frog.x - frog.fromX;
          facingDy = frog.y - frog.fromY;
          break;
        }
        case 'landing': {
          cx = (frog.x + 0.5) * cellSize;
          cy = (frog.y + 0.5) * cellSize;
          // Impact absorb: brief triangular squish peaking mid-landing
          const lt = Math.min(1, age / FROG_LAND_MS);
          const squish = 1 - Math.abs(lt - 0.5) * 2;
          bodyScaleY = 1 - squish * 0.25;
          bodyScaleX = 1 + squish * 0.14;
          legExtend = (1 - lt) * 0.6;   // legs still partly extended, folding back
          break;
        }
      }

      // Spawn/despawn fade
      const totalAge = now - frog.spawnTime;
      const spawnPulse = Math.max(0, 1 - totalAge / 400);
      const despawnT = Math.max(0, (totalAge - (FROG_LIFESPAN_MS - 800)) / 800);
      const fade = 1 - Math.min(1, despawnT);

      // Facing rotation for the frog body (points in direction of last/next jump)
      let facingAngle = 0;
      if (facingDx !== 0 || facingDy !== 0) {
        facingAngle = Math.atan2(facingDy, facingDx) + Math.PI / 2;   // frog faces "north" by default
      }

      // ---- Ground shadow (stays on ground plane, not on frog) ----
      ctx.save();
      ctx.globalAlpha = fade;
      const heightRatio = Math.abs(arc) / (cellSize * FROG_JUMP_HEIGHT_CELLS + 0.01);
      const sScale = 1 - heightRatio * 0.45;
      const sAlpha = 0.30 - heightRatio * 0.18;
      ctx.fillStyle = `rgba(0,0,0,${Math.max(0.05, sAlpha)})`;
      ctx.filter = 'blur(4px)';
      const cellSize2 = cellSize;
      ctx.beginPath();
      ctx.ellipse(cx, cy + cellSize2 * 0.30, cellSize2 * 0.36 * sScale, cellSize2 * 0.11 * sScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ---- Frog body (at cx, cy + arc, with facing rotation and scale) ----
      ctx.save();
      ctx.globalAlpha = fade * (1 + spawnPulse * 0.4);
      ctx.translate(cx, cy + arc);
      ctx.rotate(facingAngle);
      ctx.scale(bodyScaleX, bodyScaleY);

      drawFrogBody(cellSize * 0.36, legExtend, headTilt);
      ctx.restore();
    }

    function drawFrogBody(r, legExtend, headTilt) {
      // r = base radius; legExtend = 0 (folded) to 1 (fully extended, jump peak)
      // Top-down view: head at top (-y direction in local frame after rotation).

      // --- HIND LEGS (drawn first, behind body) ---
      // Sitting: legs folded in "M" shape at sides
      // Extended: legs kick back and outward
      const legBaseX = r * 0.55;
      const legBaseY = r * 0.10;
      const kneeX = r * (0.85 + legExtend * 0.20);
      const kneeY = r * (0.05 - legExtend * 0.15);
      const footX = r * (0.55 + legExtend * 0.55);
      const footY = r * (0.55 + legExtend * 0.30);

      ctx.fillStyle = '#2a6a2a';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#1e5a20';

      // Left hind leg
      ctx.beginPath();
      ctx.moveTo(-legBaseX, legBaseY);
      ctx.quadraticCurveTo(-kneeX, kneeY, -footX, footY);
      ctx.quadraticCurveTo(-footX * 0.9, footY + r * 0.18, -footX * 0.6, footY + r * 0.14);
      ctx.quadraticCurveTo(-r * 0.45, legBaseY + r * 0.25, -legBaseX, legBaseY);
      ctx.closePath();
      ctx.fill();
      // Webbed foot toes (3 small circles at foot end)
      ctx.fillStyle = '#4a8a3a';
      ctx.shadowBlur = 0;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(-footX - r * 0.06, footY + i * r * 0.10, r * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }

      // Right hind leg (mirror)
      ctx.fillStyle = '#2a6a2a';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#1e5a20';
      ctx.beginPath();
      ctx.moveTo(legBaseX, legBaseY);
      ctx.quadraticCurveTo(kneeX, kneeY, footX, footY);
      ctx.quadraticCurveTo(footX * 0.9, footY + r * 0.18, footX * 0.6, footY + r * 0.14);
      ctx.quadraticCurveTo(r * 0.45, legBaseY + r * 0.25, legBaseX, legBaseY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4a8a3a';
      ctx.shadowBlur = 0;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(footX + r * 0.06, footY + i * r * 0.10, r * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- BODY (squat oval, wider at back) ---
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(30,80,30,0.5)';
      const bodyGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.3, 1, 0, 0, r * 1.15);
      bodyGrad.addColorStop(0, '#98e068');
      bodyGrad.addColorStop(0.55, '#4ec24a');
      bodyGrad.addColorStop(1, '#1e6a28');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      // Squat oval — slightly wider at back (positive y) than front (head area)
      ctx.ellipse(0, r * 0.05, r * 0.85, r * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dorsal stripe (subtle darker mid-line)
      ctx.strokeStyle = 'rgba(20,60,20,0.5)';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.5);
      ctx.lineTo(0, r * 0.6);
      ctx.stroke();

      // Back spots (few dark stipples for texture)
      ctx.fillStyle = 'rgba(20,60,20,0.55)';
      const spots = [
        [-r*0.35, -r*0.15, r*0.10],
        [r*0.30, -r*0.05, r*0.08],
        [r*0.40,  r*0.30, r*0.09],
        [-r*0.30, r*0.35, r*0.10],
        [r*0.05,  r*0.20, r*0.07],
        [-r*0.10, -r*0.05, r*0.06],
      ];
      for (const [sx, sy, sr] of spots) {
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- FRONT LEGS (small paws visible at front-sides) ---
      ctx.fillStyle = '#4ec24a';
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(30,80,30,0.4)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.42, -r * 0.30, r * 0.14, r * 0.10, -0.3, 0, Math.PI * 2);
      ctx.ellipse( r * 0.42, -r * 0.30, r * 0.14, r * 0.10,  0.3, 0, Math.PI * 2);
      ctx.fill();

      // --- HEAD BASE (slight darker mound where eyes will sit) ---
      ctx.fillStyle = '#3a8a3a';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r * 0.30, -r * 0.55 + headTilt * r * 0.1, r * 0.22, 0, Math.PI * 2);
      ctx.arc( r * 0.30, -r * 0.55 + headTilt * r * 0.1, r * 0.22, 0, Math.PI * 2);
      ctx.fill();

      // --- EYES (bulging orbs on top of head) ---
      const eyeY = -r * 0.62 + headTilt * r * 0.1;
      // Outer green orb
      ctx.fillStyle = '#78d848';
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(120,216,72,0.5)';
      ctx.beginPath();
      ctx.arc(-r * 0.30, eyeY, r * 0.19, 0, Math.PI * 2);
      ctx.arc( r * 0.30, eyeY, r * 0.19, 0, Math.PI * 2);
      ctx.fill();

      // Iris — golden yellow
      ctx.fillStyle = '#f2c840';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r * 0.30, eyeY, r * 0.13, 0, Math.PI * 2);
      ctx.arc( r * 0.30, eyeY, r * 0.13, 0, Math.PI * 2);
      ctx.fill();

      // Vertical slit pupils (frog signature)
      ctx.fillStyle = '#000';
      ctx.fillRect(-r * 0.32, eyeY - r * 0.09, r * 0.04, r * 0.18);
      ctx.fillRect( r * 0.28, eyeY - r * 0.09, r * 0.04, r * 0.18);

      // Eye highlights (small white glints for life)
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(-r * 0.26, eyeY - r * 0.10, r * 0.04, 0, Math.PI * 2);
      ctx.arc( r * 0.34, eyeY - r * 0.10, r * 0.04, 0, Math.PI * 2);
      ctx.fill();

      // --- NOSTRILS (small dots below eyes, on front of head) ---
      ctx.fillStyle = 'rgba(20,50,20,0.7)';
      ctx.beginPath();
      ctx.arc(-r * 0.10, -r * 0.42 + headTilt * r * 0.1, r * 0.035, 0, Math.PI * 2);
      ctx.arc( r * 0.10, -r * 0.42 + headTilt * r * 0.1, r * 0.035, 0, Math.PI * 2);
      ctx.fill();

      // --- MOUTH (wide curved line across face) ---
      ctx.strokeStyle = 'rgba(20,50,20,0.8)';
      ctx.lineWidth = 1.3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r * 0.45, -r * 0.28 + headTilt * r * 0.1);
      ctx.quadraticCurveTo(0, -r * 0.14 + headTilt * r * 0.1, r * 0.45, -r * 0.28 + headTilt * r * 0.1);
      ctx.stroke();
    }

    function renderWorm(time) {
      const cellSize = GRID.cellSize;
      const bodyWidth = cellSize * 0.72;
      const t = worm.interpolation;
      const N = worm.segments.length;
      if (N === 0) return;

      // Build points array: interpolated head first, then all body cells,
      // with tail retracted if not growing this tick.
      const points = [];

      // Head with forward interpolation
      const head = worm.segments[0];
      const headX = (head.x + 0.5 + worm.direction.dx * t) * cellSize;
      const headY = (head.y + 0.5 + worm.direction.dy * t) * cellSize;
      points.push({x: headX, y: headY, isHead: true});

      // All body segments (cell centers)
      for (let i = 0; i < N; i++) {
        const s = worm.segments[i];
        points.push({x: (s.x + 0.5) * cellSize, y: (s.y + 0.5) * cellSize});
      }

      // Tail retraction: if we're not growing, the tail moves toward the segment
      // in front of it during the tick. Interpolate.
      if (worm.growing === 0 && N > 1) {
        const tail = worm.segments[N - 1];
        const before = worm.segments[N - 2];
        const tdx = before.x - tail.x;
        const tdy = before.y - tail.y;
        // Replace last point with interpolated position
        points[points.length - 1] = {
          x: (tail.x + 0.5 + tdx * t) * cellSize,
          y: (tail.y + 0.5 + tdy * t) * cellSize,
        };
      }

      // ---- Single-pass glow (whole body one stroke) ----
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      ctx.shadowBlur = T.wormGlowRadius;
      ctx.shadowColor = T.wormGlow;
      ctx.strokeStyle = T.wormBody;
      ctx.lineWidth = bodyWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        if (i === 0) ctx.moveTo(points[i].x, points[i].y);
        else ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // ---- Body fill with head-to-tail gradient (no shadow, cheap) ----
      // Draw with slightly smaller width so glow remains visible around edges.
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      // Multi-segment gradient stroke: use a linear gradient along the bounding box
      // of the path. Approximation but reads correctly for typical worm shapes.
      const bbox = getBBox(points);
      const grad = ctx.createLinearGradient(points[0].x, points[0].y,
        points[points.length-1].x, points[points.length-1].y);
      grad.addColorStop(0, T.wormHead);
      grad.addColorStop(1, T.wormBody);
      ctx.strokeStyle = grad;
      ctx.lineWidth = bodyWidth - 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        if (i === 0) ctx.moveTo(points[i].x, points[i].y);
        else ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // ---- Muscle pulse (subtle brightness ripple down body) ----
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (let i = 1; i < points.length; i++) {
        const p = points[i];
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.006 + i * 0.45);
        ctx.fillStyle = `rgba(255,255,255,${pulse * 0.10})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, (bodyWidth - 4) * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // ---- Head details: eyes + tongue ----
      const headPoint = points[0];
      const dir = worm.direction;
      ctx.save();
      ctx.translate(headPoint.x, headPoint.y);
      ctx.rotate(Math.atan2(dir.dy, dir.dx));

      const eyeR = bodyWidth * 0.14;
      // Eye whites
      ctx.fillStyle = T.wormEyeWhite;
      ctx.beginPath();
      ctx.arc(bodyWidth * 0.10, -bodyWidth * 0.22, eyeR, 0, Math.PI * 2);
      ctx.arc(bodyWidth * 0.10,  bodyWidth * 0.22, eyeR, 0, Math.PI * 2);
      ctx.fill();
      // Pupils
      ctx.fillStyle = T.wormEyeColor;
      ctx.beginPath();
      ctx.arc(bodyWidth * 0.13, -bodyWidth * 0.22, eyeR * 0.55, 0, Math.PI * 2);
      ctx.arc(bodyWidth * 0.13,  bodyWidth * 0.22, eyeR * 0.55, 0, Math.PI * 2);
      ctx.fill();
      // Slit if eye color is bright
      if (T.wormEyeColor !== '#000000') {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(bodyWidth * 0.13, -bodyWidth * 0.30);
        ctx.lineTo(bodyWidth * 0.13, -bodyWidth * 0.14);
        ctx.moveTo(bodyWidth * 0.13,  bodyWidth * 0.14);
        ctx.lineTo(bodyWidth * 0.13,  bodyWidth * 0.30);
        ctx.stroke();
      }

      // Tongue flick (occasional)
      const flick = Math.sin(time * 0.0032);
      if (flick > 0.7) {
        const extend = (flick - 0.7) / 0.3;
        ctx.strokeStyle = '#ff2266';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(bodyWidth * 0.45, 0);
        ctx.lineTo(bodyWidth * 0.55 + extend * 6, -1.5);
        ctx.moveTo(bodyWidth * 0.45, 0);
        ctx.lineTo(bodyWidth * 0.55 + extend * 6,  1.5);
        ctx.stroke();
      }

      ctx.restore();
    }

    function getBBox(points) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      return { minX, minY, maxX, maxY };
    }

    // ================= COLOR UTILS =================
    // parseColor handles both '#rrggbb' AND 'rgb(r,g,b)' formats,
    // so lightenColor/darkenColor can safely take lerpColor's output.
    function parseColor(str) {
      if (str.startsWith('#')) {
        return [
          parseInt(str.slice(1,3),16),
          parseInt(str.slice(3,5),16),
          parseInt(str.slice(5,7),16),
        ];
      }
      const m = str.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (m) return [parseInt(m[1],10), parseInt(m[2],10), parseInt(m[3],10)];
      return [128, 128, 128];
    }
    function toRgb(r, g, b) {
      return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
    }
    function lerpColor(c1, c2, t) {
      const [r1,g1,b1] = parseColor(c1);
      const [r2,g2,b2] = parseColor(c2);
      return toRgb(r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t);
    }
    function lightenColor(color, factor) {
      const [r, g, b] = parseColor(color);
      return toRgb(r + (255-r)*factor, g + (255-g)*factor, b + (255-b)*factor);
    }
    function darkenColor(color, factor) {
      const [r, g, b] = parseColor(color);
      return toRgb(r*(1-factor), g*(1-factor), b*(1-factor));
    }

    // ================= MAIN LOOP =================
    let lastTime = performance.now();
    function loop(time) {
      const dt = Math.min(50, time - lastTime);
      lastTime = time;
      const now = performance.now();

      if (game.state !== 'playing') game.overOffTime += dt;

      updateDrift(dt);
      updateApples(dt);
      updateApplesLifecycle(now);      // Wild mode rot + delayed respawn
      updateFrog(now);                  // Wild mode frog bonus
      updateBird(dt, now);              // Wild mode enemy: Bird (Phase 1)
      updateWasps(dt, now);             // Wild mode enemy: Wasps (Phase 2)
      updateGardener(dt, now);          // Wild mode enemy: Gardener (Phase 4)
      updateParticles(dt);

      if (game.state === 'playing') {
        worm.tickTimer += dt;
        worm.interpolation = Math.min(1, worm.tickTimer / worm.tickInterval);
        while (worm.tickTimer >= worm.tickInterval && game.state === 'playing') {
          worm.tickTimer -= worm.tickInterval;
          worm.interpolation = 0;
          doTick();
        }
      }

      renderBackground(time);
      renderApples(time);
      renderFrog(now);
      renderBird(now);
      renderWasps(now);
      renderGardener(now);

      if (game.state === 'dead') {
        // Fade worm during death
        const t = Math.min(1, game.overOffTime / 400);
        ctx.save();
        ctx.globalAlpha = 1 - t;
        renderWorm(time);
        ctx.restore();
      } else {
        renderWorm(time);
      }

      renderParticles();

      requestAnimationFrame(loop);
    }

    // ================= INIT =================
    initWorm();
    initApples();
    scheduleNextFrog(performance.now());
    scheduleNextBird(performance.now());
    scheduleNextGardener(performance.now());
    updateTickInterval();
    updateScoreDisplay();
    updateLengthDisplay();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
