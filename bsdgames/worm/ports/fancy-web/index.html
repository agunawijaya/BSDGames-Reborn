<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>worm · fancy-web · mockup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --page-bg: #f7f4ee;
      --page-bg-2: #efeae0;
      --ink: #2a2a2e;
      --ink-soft: #6a6a72;
      --ink-faint: #a8a7ac;
      --card: #ffffff;
      --card-border: #e0dcd2;
      --accent: #2a2a2e;
    }

    html, body {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 0%, var(--page-bg) 0%, var(--page-bg-2) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 24px; gap: 14px; min-height: 100vh; overflow-y: auto;
    }

    .header { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', SF Mono, Monaco, Consolas, monospace;
      font-size: 11px; letter-spacing: 0.28em;
      color: var(--ink-soft); text-transform: uppercase;
    }
    .subtitle {
      font-size: 22px; font-weight: 300; letter-spacing: -0.01em; color: var(--ink);
    }

    .picker-group {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      width: 100%;
    }
    .picker-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--ink-faint);
    }
    .picker-row {
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 900px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px 6px 8px;
      background: var(--card); border: 1.5px solid var(--card-border); border-radius: 999px;
      cursor: pointer; font-family: inherit; font-size: 11px; color: var(--ink-soft);
      transition: all 0.18s cubic-bezier(0.2, 0.6, 0.3, 1); user-select: none;
    }
    .btn:hover { border-color: var(--ink-soft); color: var(--ink); transform: translateY(-1px); }
    .btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .btn .swatch { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.4); }
    .btn.speed-btn { padding: 6px 14px; }

    .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px; }
    .canvas-wrap { position: relative; display: block; }
    canvas {
      display: block; max-width: 100%; max-height: 68vh;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.20),
                  0 12px 24px -8px rgba(0,0,0,0.10),
                  0 0 0 1px rgba(0,0,0,0.06);
      border-radius: 10px; background: #050a1a;
    }
    .game-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; pointer-events: none; opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.2, 0.7, 0.3, 1);
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.45) 100%);
      border-radius: 10px; color: white;
      font-family: 'JetBrains Mono', monospace;
    }
    .game-overlay.visible { opacity: 1; }
    .game-overlay .go-title {
      font-size: 48px; font-weight: 300; letter-spacing: 0.15em;
      text-shadow: 0 0 30px rgba(255,255,255,0.4), 0 4px 20px rgba(0,0,0,0.6);
    }
    .game-overlay .go-title.win { color: #a0f0d0; }
    .game-overlay .go-title.dead { color: #ffa0a0; }
    .game-overlay .go-sub {
      font-size: 14px; letter-spacing: 0.2em; opacity: 0.85;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .game-overlay .go-instr {
      font-size: 11px; letter-spacing: 0.28em; opacity: 0.65;
      margin-top: 24px; text-transform: uppercase;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.35; } }

    .meta-row {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; max-width: 900px; padding: 0 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft); gap: 12px;
    }
    .meta-row .keys kbd {
      display: inline-block; padding: 2px 6px;
      background: var(--card); border: 1px solid var(--card-border);
      border-bottom-width: 2px; border-radius: 4px;
      font-family: inherit; font-size: 10px; color: var(--ink); margin: 0 1px;
    }
    .meta-row .stats { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
    .meta-row .stats .label { color: var(--ink-faint); }
    .meta-row .stats .value {
      color: var(--ink); font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
      min-width: 22px; display: inline-block;
    }
    .meta-row .stats .sep { color: var(--ink-faint); margin: 0 4px; }
    .meta-row .tick {
      display: flex; gap: 8px; align-items: center;
    }
    .meta-row .tick .label { color: var(--ink-faint); }
    .meta-row .tick .value {
      color: var(--ink); font-weight: 700; min-width: 92px; text-align: left;
    }
    .footer {
      font-size: 10.5px; color: var(--ink-faint); letter-spacing: 0.05em;
      font-family: 'JetBrains Mono', monospace; margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">worm · fancy-web · mockup</div>
    <div class="subtitle">Growing worm — collect numbered apples, don't hit yourself</div>
  </div>

  <div class="picker-group">
    <div class="picker-label">theme</div>
    <div class="picker-row" id="themePicker"></div>
  </div>

  <div class="picker-group">
    <div class="picker-label">speed</div>
    <div class="picker-row" id="speedPicker"></div>
  </div>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="c" width="900" height="600"></canvas>
      <div class="game-overlay" id="gameOverlay"></div>
    </div>
    <div class="meta-row">
      <div class="keys">steer &nbsp; <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp; · &nbsp; <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div>
      <div class="stats">
        <span class="label">score</span><span class="value" id="scoreLabel">0</span>
        <span class="sep">·</span>
        <span class="label">length</span><span class="value" id="lengthLabel">5</span>
        <span class="sep">·</span>
        <span class="label">best</span><span class="value" id="bestLabel">0</span>
      </div>
      <div class="tick">
        <span class="label">tick</span><span class="value" id="tickLabel">1.0s</span>
      </div>
    </div>
  </div>

  <div class="footer">apple digit = growth &amp; score bonus · chained eating stacks · reach any wall = die</div>

  <script>
  (() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreLabel = document.getElementById('scoreLabel');
    const bestLabel = document.getElementById('bestLabel');
    const lengthLabel = document.getElementById('lengthLabel');
    const tickLabel = document.getElementById('tickLabel');
    const gameOverlay = document.getElementById('gameOverlay');
    const themePicker = document.getElementById('themePicker');
    const speedPicker = document.getElementById('speedPicker');

    const W = canvas.width;
    const H = canvas.height;

    // ================= GRID =================
    const GRID = {
      cellSize: 30,
      cols: 30,     // 30 * 30 = 900
      rows: 20,     // 20 * 30 = 600
    };

    // ================= PERSISTENCE =================
    const BEST_KEY = 'worm-fancy-best';
    const SETTINGS_KEY = 'worm-fancy-settings';

    function readSettings() {
      try {
        const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
        return {
          speed: s.speed || 'progressive',
          theme: s.theme || 'neon-grid',
        };
      } catch (e) {
        return { speed: 'progressive', theme: 'neon-grid' };
      }
    }
    function writeSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          speed: settings.speed, theme: currentTheme
        }));
      } catch (e) {}
    }

    const settings = readSettings();

    // ================= GAME STATE =================
    const game = {
      state: 'playing',        // 'playing' | 'dead' | 'won'
      score: 0,
      bestScore: parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0,
      overOffTime: 0,
      canRestart: false,
    };

    // ================= WORM =================
    const worm = {
      segments: [],                    // array of {x, y} grid cells; index 0 = head
      direction: {dx: 1, dy: 0},       // current move direction
      pendingDirection: {dx: 1, dy: 0},// buffered from input
      growing: 0,                       // pending growth (BSD spec: tail stays N ticks after eat)
      tickInterval: 1000,               // ms between ticks; set by speed setting
      tickTimer: 0,                     // ms accumulator
      interpolation: 0,                 // 0..1 through current tick (for smooth render)
    };

    function initWorm() {
      worm.segments = [];
      const startLen = 5;
      const startX = Math.floor(GRID.cols / 2) - 2;
      const startY = Math.floor(GRID.rows / 2);
      for (let i = 0; i < startLen; i++) {
        worm.segments.push({x: startX - i, y: startY});
      }
      worm.direction = {dx: 1, dy: 0};
      worm.pendingDirection = {dx: 1, dy: 0};
      worm.growing = 0;
      worm.tickTimer = 0;
      worm.interpolation = 0;
    }

    // ================= APPLE (numbered 1-9) =================
    const apple = { x: 0, y: 0, value: 5, spin: 0, bob: 0 };
    function spawnApple() {
      const occupied = new Set(worm.segments.map(s => `${s.x},${s.y}`));
      let x, y, attempts = 0;
      do {
        x = Math.floor(Math.random() * GRID.cols);
        y = Math.floor(Math.random() * GRID.rows);
        attempts++;
      } while (occupied.has(`${x},${y}`) && attempts < 200);
      apple.x = x;
      apple.y = y;
      apple.value = 1 + Math.floor(Math.random() * 9);
      apple.spin = 0;
      apple.bob = Math.random() * Math.PI * 2;
    }

        driftColors: ['rgba(255,220,140,ALPHA)', 'rgba(230,180,100,ALPHA)'],
        composite: 'source-over',

        sandBlow: true,
      },
      'river': {

        swatch: 'linear-gradient(135deg,#c0e0e8 0%,#3a8ab8 50%,#164560 100%)',
        bg: '#3a8ab8',
        bgGradient: [
          { pos: 0,   color: '#c0e0e8' },

      },

        appleRipe: '#e8515e',
        appleGlow: 'rgba(232,81,94,0.2)',
        appleLeaf: '#7ec585',

      },
      'midnight': {

          { pos: 0,   color: '#2a1a4a' },
          { pos: 0.6, color: '#160830' },
          { pos: 1,   color: '#0a0418' },
        ],
        vignette: 'rgba(80,50,120,0.35)',
        gridLine: 'rgba(140,100,200,0.14)',
        gridDot: 'rgba(200,180,255,0.5)',
        gridDotGlow: 3,
        wormHead: '#e0d8ff',
        wormBody: '#5b2c8a',
        wormGlow: 'rgba(180,150,240,0.55)',
        wormGlowRadius: 18,
        wormEyeWhite: '#ffdd44',
        wormEyeColor: '#1a0a2a',
        appleBase: '#8878a8',
        appleRipe: '#c02040',

        appleLeaf: '#5a3a5a',
        appleStem: '#3a2a1a',
        appleDigit: '#fff0c0',

        driftColors: ['rgba(200,180,255,ALPHA)', 'rgba(255,220,120,ALPHA)'],

      },

    let currentTheme = THEMES[settings.theme] ? settings.theme : 'neon-grid';
    let T = THEMES[currentTheme];

    // Build theme picker
    Object.entries(THEMES).forEach(([key, theme]) => {
      const btn = document.createElement('button');
      btn.className = 'btn theme-btn' + (key === currentTheme ? ' active' : '');
      btn.dataset.theme = key;
      btn.innerHTML = `<span class="swatch" style="background:${theme.swatch}"></span><span>${theme.name}</span>`;
      btn.onclick = () => setTheme(key);
      themePicker.appendChild(btn);
    });

    function setTheme(name) {
      currentTheme = name;
      T = THEMES[name];
      themePicker.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === name);
      });
      invalidateStaticLayer();
      writeSettings();
    }

    // ================= SPEED SETTINGS =================
    const SPEEDS = [
      { key: 'classic',     label: 'Classic  ·  1×',    description: 'BSD faithful — 1 tick / sec' },
      { key: 'fast',        label: 'Fast  ·  3×',       description: 'Modern arcade — 3 ticks / sec' },
      { key: 'progressive', label: 'Progressive  ·  1→4×', description: 'Scales with length' },
    ];

    SPEEDS.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'btn speed-btn' + (s.key === settings.speed ? ' active' : '');
      btn.dataset.speed = s.key;
      btn.textContent = s.label;
      btn.title = s.description;
      btn.onclick = () => setSpeed(s.key);
      speedPicker.appendChild(btn);
    });

    function setSpeed(key) {
      settings.speed = key;
      speedPicker.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.speed === key);
      });
      writeSettings();
      updateTickInterval();
    }

    function updateTickInterval() {
      const s = settings.speed;
      let interval;
      if (s === 'classic') {
        interval = 1000;
      } else if (s === 'fast') {
        interval = 333;
      } else {
        // Progressive: 1000ms (short worm) → 250ms (worm at 45+ segments)
        const len = worm.segments.length;
        const t = Math.min(1, Math.max(0, (len - 5) / 40));
        interval = Math.round(1000 - t * 750);
      }
      worm.tickInterval = interval;
      tickLabel.textContent = `${(interval / 1000).toFixed(2)}s`;
    }

    // ================= INPUT =================
    document.addEventListener('keydown', (e) => {
      if (game.state !== 'playing') {
        if (game.canRestart) { restartGame(); e.preventDefault(); }
        return;
      }

      const k = e.key.toLowerCase();
      let dx = 0, dy = 0, valid = false;
      if (k === 'arrowright' || k === 'd') { dx = 1;  dy = 0;  valid = true; }
      else if (k === 'arrowleft' || k === 'a') { dx = -1; dy = 0;  valid = true; }
      else if (k === 'arrowup' || k === 'w') { dx = 0;  dy = -1; valid = true; }
      else if (k === 'arrowdown' || k === 's') { dx = 0;  dy = 1;  valid = true; }
      if (!valid) return;
      e.preventDefault();

      // Prevent 180° turn (can't reverse directly into own neck)
      if (dx === -worm.direction.dx && dy === -worm.direction.dy) return;
      worm.pendingDirection = {dx, dy};
    });

    // ================= TICK LOGIC (BSD spec) =================
    function doTick() {
      if (game.state !== 'playing') return;

      // Commit buffered direction
      worm.direction = worm.pendingDirection;

      const oldHead = worm.segments[0];
      const newHead = {
        x: oldHead.x + worm.direction.dx,
        y: oldHead.y + worm.direction.dy,
      };

      // Death: wall
      if (newHead.x < 0 || newHead.x >= GRID.cols || newHead.y < 0 || newHead.y >= GRID.rows) {
        return triggerDeath('wall');
      }

      // Death: self collision.
      // If we're not growing this tick, the tail WILL move away, so it's safe to
      // occupy the tail's OLD cell. Check all segments except the last one.
      const willShrinkTail = worm.growing === 0;
      const checkUntil = willShrinkTail ? worm.segments.length - 1 : worm.segments.length;
      for (let i = 0; i < checkUntil; i++) {
        if (worm.segments[i].x === newHead.x && worm.segments[i].y === newHead.y) {
          return triggerDeath('self');
        }
      }

      // Add new head
      worm.segments.unshift(newHead);

      // Eat apple? — check BEFORE tail resolution, matches BSD source
      if (newHead.x === apple.x && newHead.y === apple.y) {
        worm.growing += apple.value;         // BSD: growing += ch - '0'
        spawnPickupBurst(apple.x, apple.y, apple.value);
        game.score += worm.growing;           // BSD: score += growing (chained bonus!)
        updateScoreDisplay();
        spawnApple();
      }

      // Tail resolution
      if (worm.growing === 0) {
        worm.segments.pop();
      } else {
        worm.growing--;
      }

      // Update progressive speed after growth
      if (settings.speed === 'progressive') updateTickInterval();
      updateLengthDisplay();

      // Win check (fill entire grid)
      if (worm.segments.length >= GRID.cols * GRID.rows - 1) {
        triggerWin();
      }
    }

    // ================= DEATH / WIN =================
    function triggerDeath(reason) {
      if (game.state !== 'playing') return;
      game.state = 'dead';
      game.overOffTime = 0;
      game.canRestart = false;
      const head = worm.segments[0];
      spawnDeathBurst(head.x, head.y);
      if (game.score > game.bestScore) {
        game.bestScore = game.score;
        try { localStorage.setItem(BEST_KEY, String(game.bestScore)); } catch(e) {}
        updateScoreDisplay();
      }
      const sub = reason === 'wall'
        ? 'crashed into the wall'
        : 'tangled with your own body';
      showOverlay('dead', 'CAUGHT', sub, 'press any key');
    }

    function triggerWin() {
      if (game.state !== 'playing') return;
      game.state = 'won';
      game.overOffTime = 0;
      game.canRestart = false;
      if (game.score > game.bestScore) {
        game.bestScore = game.score;
        try { localStorage.setItem(BEST_KEY, String(game.bestScore)); } catch(e) {}
        updateScoreDisplay();
      }
      showOverlay('win', 'GARDEN FILLED', `${game.score} chained points`, 'press any key');
    }

    function showOverlay(cls, title, sub, instr) {
      gameOverlay.innerHTML = `
        <div class="go-title ${cls}">${title}</div>
        <div class="go-sub">${sub}</div>
        <div class="go-instr">${instr}</div>
      `;
      setTimeout(() => gameOverlay.classList.add('visible'), 40);
      setTimeout(() => { game.canRestart = true; }, 550);
    }
    function hideOverlay() {
      gameOverlay.classList.remove('visible');
      gameOverlay.innerHTML = '';
    }

    function updateScoreDisplay() {
      scoreLabel.textContent = game.score;
      bestLabel.textContent = game.bestScore;
    }
    function updateLengthDisplay() {
      lengthLabel.textContent = worm.segments.length;
    }

    function restartGame() {
      game.state = 'playing';
      game.score = 0;
      hideOverlay();
      initWorm();
      spawnApple();
      particles.length = 0;
      updateScoreDisplay();
      updateLengthDisplay();
      updateTickInterval();
    }

    // ================= APPLE + PARTICLE UPDATES =================
    function updateApple(dt) {
      apple.spin += dt * 0.003;
      apple.bob  += dt * 0.0022;
    }

    // ================= PARTICLES =================
    const particles = [];
    function spawnPickupBurst(gx, gy, value) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      const count = 10 + value * 2;                 // bigger apple → more particles
      const bodyColor = appleColorForValue(value);
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + Math.random() * 0.3;
        const s = 60 + Math.random() * 120 + value * 8;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 550 + value * 30,
          maxLife: 550 + value * 30,
          color: i % 2 === 0 ? bodyColor : T.appleGlow,
          size: 2 + Math.random() * 1.2,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 400, maxLife: 400,
        ring: true, radius: 4,
        color: bodyColor,
      });
    }
    function spawnDeathBurst(gx, gy) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      for (let i = 0; i < 30; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 90 + Math.random() * 200;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 900, maxLife: 900,
          color: i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? T.wormHead : T.wormBody),
          size: 2 + Math.random() * 2,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 700, maxLife: 700,
        ring: true, radius: 6,
        color: '#ffffff',
      });
    }
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        const dtSec = dt / 1000;
        if (p.ring) {
          p.radius += 200 * dtSec;
        } else {
          p.x += p.vx * dtSec;
          p.y += p.vy * dtSec;
          p.vx *= Math.pow(0.05, dtSec);
          p.vy *= Math.pow(0.05, dtSec);
        }
      }
    }
    function renderParticles() {
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const a = p.life / p.maxLife;
        if (p.ring) {
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = a * 0.8;
          ctx.lineWidth = 3 * a;
          ctx.shadowBlur = 12; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = a;
          ctx.shadowBlur = 10; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // ================= AMBIENT DRIFT =================
    const drift = [];
    for (let i = 0; i < 40; i++) {
      drift.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: -6 - Math.random() * 12,
        vy: (Math.random() - 0.5) * 4,
        r: 0.6 + Math.random() * 1.2,
        hueIdx: Math.random() < 0.6 ? 0 : 1,
        phase: Math.random() * Math.PI * 2,
      });
    }
    const stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.9,
        r: 0.5 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.001 + Math.random() * 0.003,
      });
    }
    function updateDrift(dt) {
      const dtSec = dt / 1000;
      for (const d of drift) {
        if (T.risingParticles) {
          d.x += Math.sin(d.phase + performance.now() * 0.001) * 8 * dtSec;
          d.y -= (30 + d.r * 10) * dtSec;
          if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
        } else if (T.sandBlow) {
          d.x += d.vx * 2.2 * dtSec;
          d.y += d.vy * 0.4 * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
        } else {
          d.x += d.vx * dtSec;
          d.y += d.vy * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
          if (d.y < -10) d.y = H + 10;
          if (d.y > H + 10) d.y = -10;
        }
      }
    }

    // ================= OFFSCREEN STATIC LAYER =================
    let staticLayer = null;
    let staticLayerTheme = null;
    function invalidateStaticLayer() {
      staticLayer = null;
      staticLayerTheme = null;
    }
    function ensureStaticLayer() {
      if (staticLayer && staticLayerTheme === currentTheme) return;
      staticLayer = document.createElement('canvas');
      staticLayer.width = W;
      staticLayer.height = H;
      renderStaticLayer(staticLayer.getContext('2d'));
      staticLayerTheme = currentTheme;
    }
    function renderStaticLayer(sctx) {
      // Base bg
      if (T.bgGradient) {
        const g = sctx.createLinearGradient(0, 0, 0, H);
        for (const stop of T.bgGradient) g.addColorStop(stop.pos, stop.color);
        sctx.fillStyle = g;
      } else {
        sctx.fillStyle = T.bg;
      }
      sctx.fillRect(0, 0, W, H);

      // Vignette
      const vg = sctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W*0.7);
      vg.addColorStop(0, T.vignette);
      vg.addColorStop(1, 'rgba(0,0,0,0)');
      sctx.fillStyle = vg;
      sctx.fillRect(0, 0, W, H);

      // Grid lines (aligned with GRID.cellSize)
      sctx.strokeStyle = T.gridLine;
      sctx.lineWidth = 1;
      sctx.beginPath();
      for (let x = GRID.cellSize; x < W; x += GRID.cellSize) {
        sctx.moveTo(x + 0.5, 0);
        sctx.lineTo(x + 0.5, H);
      }
      for (let y = GRID.cellSize; y < H; y += GRID.cellSize) {
        sctx.moveTo(0, y + 0.5);
        sctx.lineTo(W, y + 0.5);
      }
      sctx.stroke();

      // Grid intersection dots
      sctx.save();
      if (T.composite === 'lighter') sctx.globalCompositeOperation = 'lighter';
      sctx.fillStyle = T.gridDot;
      if (T.gridDotGlow > 0) {
        sctx.shadowBlur = T.gridDotGlow;
        sctx.shadowColor = T.gridDot;
      }
      for (let x = GRID.cellSize; x < W; x += GRID.cellSize) {
        for (let y = GRID.cellSize; y < H; y += GRID.cellSize) {
          sctx.beginPath();
          sctx.arc(x, y, 1.2, 0, Math.PI * 2);
          sctx.fill();
        }
      }
      sctx.restore();

      // Wall frame — emphasize the deadly boundary with a strong border
      sctx.save();
      sctx.strokeStyle = T.gridDot;
      sctx.lineWidth = 3;
      if (T.gridDotGlow > 0) {
        sctx.shadowBlur = T.gridDotGlow * 2;
        sctx.shadowColor = T.gridDot;
      }
      sctx.strokeRect(1.5, 1.5, W - 3, H - 3);
      sctx.restore();

      // Moon crescent for Midnight
      if (T.stars) {
        const moonX = W - 80, moonY = 80, moonR = 24;
        const coverX = moonX + 10, coverY = moonY - 4, coverR = 22;
        sctx.save();
        sctx.beginPath();
        sctx.rect(0, 0, W, H);
        sctx.arc(coverX, coverY, coverR, 0, Math.PI * 2, true);
        sctx.clip('evenodd');
        sctx.shadowBlur = 30;
        sctx.shadowColor = 'rgba(240,235,220,0.7)';
        sctx.fillStyle = 'rgba(240,235,220,0.95)';
        sctx.beginPath();
        sctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        sctx.fill();
        sctx.restore();
      }
    }

    // ================= APPLE COLOR =================
    function appleColorForValue(v) {
      const t = (v - 1) / 8;   // 0..1
      return lerpColor(T.appleBase, T.appleRipe, t);
    }

    // ================= RENDERING =================
    function renderBackground(time) {
      ensureStaticLayer();
      ctx.drawImage(staticLayer, 0, 0);

      // Stars
      if (T.stars) {
        ctx.save();
        for (const s of stars) {
          const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(time * s.twinkleSpeed + s.phase));
          ctx.fillStyle = `rgba(255,255,220,${twinkle})`;
          ctx.shadowBlur = 4;
          ctx.shadowColor = '#ffeecc';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * twinkle, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Drift particles
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const d of drift) {
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.002 + d.phase);
        const color = T.driftColors[d.hueIdx].replace('ALPHA', (0.25 * pulse).toFixed(2));
        ctx.fillStyle = color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderApple(time) {
      const cellSize = GRID.cellSize;
      const cx = (apple.x + 0.5) * cellSize;
      const cy = (apple.y + 0.5) * cellSize;
      const bob = Math.sin(apple.bob) * 2;

      // Size scales with value (0.55 to 1.0 of cellSize/2)
      const sizeFactor = 0.55 + (apple.value / 9) * 0.45;
      const r = (cellSize / 2 - 3) * sizeFactor;

      const bodyColor = appleColorForValue(apple.value);
      const bodyLight = lightenColor(bodyColor, 0.35);
      const bodyDark = darkenColor(bodyColor, 0.35);

      ctx.save();
      ctx.translate(cx, cy + bob);
      const spin = Math.sin(apple.spin);

      // Ground shadow (soft ellipse)
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.filter = 'blur(3px)';
      ctx.beginPath();
      ctx.ellipse(0, r + 4, r * 0.9, r * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Apple body with radial gradient
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      ctx.shadowBlur = 18;
      ctx.shadowColor = T.appleGlow;

      const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 1, 0, 0, r * 1.4);
      bodyGrad.addColorStop(0, bodyLight);
      bodyGrad.addColorStop(0.55, bodyColor);
      bodyGrad.addColorStop(1, bodyDark);
      ctx.fillStyle = bodyGrad;

      // Proper apple silhouette (stem well + calyx)
      const w = r * 1.02, h = r;
      ctx.beginPath();
      ctx.moveTo(-r * 0.2, -h + 1);
      ctx.quadraticCurveTo(-r * 0.1, -h + 2.5, 0, -h + 1.8);
      ctx.quadraticCurveTo(r * 0.1, -h + 2.5, r * 0.2, -h + 1);
      ctx.bezierCurveTo(r * 0.6, -h + 0.5, w * 0.95, -h * 0.55, w, -h * 0.15);
      ctx.bezierCurveTo(w * 1.05, h * 0.4, w * 0.6, h * 0.95, w * 0.3, h * 0.92);
      ctx.quadraticCurveTo(w * 0.1, h * 1.05, 0, h * 0.90);
      ctx.quadraticCurveTo(-w * 0.1, h * 1.05, -w * 0.3, h * 0.92);
      ctx.bezierCurveTo(-w * 0.6, h * 0.95, -w * 1.05, h * 0.4, -w, -h * 0.15);
      ctx.bezierCurveTo(-w * 0.95, -h * 0.55, -r * 0.6, -h + 0.5, -r * 0.2, -h + 1);
      ctx.closePath();
      ctx.fill();

      // Highlight
      ctx.save();
      ctx.shadowBlur = 0;
      const hlGrad = ctx.createRadialGradient(-r * 0.35 + spin, -r * 0.4, 0, -r * 0.35 + spin, -r * 0.4, r * 0.5);
      hlGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
      hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hlGrad;
      ctx.beginPath();
      ctx.ellipse(-r * 0.3 + spin, -r * 0.35, r * 0.25, r * 0.4, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Specular dot
      ctx.save();
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.arc(-r * 0.35 + spin, -r * 0.5, r * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Stem
      ctx.save();
      ctx.strokeStyle = T.appleStem;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -h + 1);
      ctx.quadraticCurveTo(r * 0.15, -h - 2, r * 0.3, -h - 3);
      ctx.stroke();
      ctx.restore();

      // Leaf
      ctx.save();
      ctx.translate(r * 0.3, -h - 3);
      ctx.rotate(-0.5);
      const leafGrad = ctx.createLinearGradient(0, -0.5, r * 0.5, 0.5);
      leafGrad.addColorStop(0, lightenColor(T.appleLeaf, 0.2));
      leafGrad.addColorStop(1, darkenColor(T.appleLeaf, 0.2));
      ctx.fillStyle = leafGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0.3);
      ctx.quadraticCurveTo(r * 0.25, -r * 0.3, r * 0.55, -r * 0.1);
      ctx.quadraticCurveTo(r * 0.65, 0, r * 0.5, r * 0.1);
      ctx.quadraticCurveTo(r * 0.25, r * 0.2, 0, 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,40,10,0.4)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(r * 0.5, -0.1);
      ctx.stroke();
      ctx.restore();

      // The DIGIT — big centered, with glow
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = 'source-over';
      const digitSize = r * 1.35;
      ctx.font = `900 ${digitSize}px 'JetBrains Mono', 'Fira Code', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Text shadow for readability
      ctx.fillStyle = T.appleDigitShadow;
      ctx.fillText(String(apple.value), 1, 1);
      ctx.fillStyle = T.appleDigit;
      ctx.fillText(String(apple.value), 0, 0);
      ctx.restore();

      ctx.restore();
    }

    function renderWorm(time) {
      const cellSize = GRID.cellSize;
      const bodyWidth = cellSize * 0.72;
      const t = worm.interpolation;
      const N = worm.segments.length;
      if (N === 0) return;

      // Build points array: interpolated head first, then all body cells,
      // with tail retracted if not growing this tick.
      const points = [];

      // Head with forward interpolation
      const head = worm.segments[0];
      const headX = (head.x + 0.5 + worm.direction.dx * t) * cellSize;
      const headY = (head.y + 0.5 + worm.direction.dy * t) * cellSize;
      points.push({x: headX, y: headY, isHead: true});

      // All body segments (cell centers)
      for (let i = 0; i < N; i++) {
        const s = worm.segments[i];
        points.push({x: (s.x + 0.5) * cellSize, y: (s.y + 0.5) * cellSize});
      }

      // Tail retraction: if we're not growing, the tail moves toward the segment
      // in front of it during the tick. Interpolate.
      if (worm.growing === 0 && N > 1) {
        const tail = worm.segments[N - 1];
        const before = worm.segments[N - 2];
        const tdx = before.x - tail.x;
        const tdy = before.y - tail.y;
        // Replace last point with interpolated position
        points[points.length - 1] = {
          x: (tail.x + 0.5 + tdx * t) * cellSize,
          y: (tail.y + 0.5 + tdy * t) * cellSize,
        };
      }

      // ---- Single-pass glow (whole body one stroke) ----
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      ctx.shadowBlur = T.wormGlowRadius;
      ctx.shadowColor = T.wormGlow;
      ctx.strokeStyle = T.wormBody;
      ctx.lineWidth = bodyWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        if (i === 0) ctx.moveTo(points[i].x, points[i].y);
        else ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // ---- Body fill with head-to-tail gradient (no shadow, cheap) ----
      // Draw with slightly smaller width so glow remains visible around edges.
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      // Multi-segment gradient stroke: use a linear gradient along the bounding box
      // of the path. Approximation but reads correctly for typical worm shapes.
      const bbox = getBBox(points);
      const grad = ctx.createLinearGradient(points[0].x, points[0].y,
        points[points.length-1].x, points[points.length-1].y);
      grad.addColorStop(0, T.wormHead);
      grad.addColorStop(1, T.wormBody);
      ctx.strokeStyle = grad;
      ctx.lineWidth = bodyWidth - 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        if (i === 0) ctx.moveTo(points[i].x, points[i].y);
        else ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // ---- Muscle pulse (subtle brightness ripple down body) ----
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (let i = 1; i < points.length; i++) {
        const p = points[i];
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.006 + i * 0.45);
        ctx.fillStyle = `rgba(255,255,255,${pulse * 0.10})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, (bodyWidth - 4) * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // ---- Head details: eyes + tongue ----
      const headPoint = points[0];
      const dir = worm.direction;
      ctx.save();
      ctx.translate(headPoint.x, headPoint.y);
      ctx.rotate(Math.atan2(dir.dy, dir.dx));

      const eyeR = bodyWidth * 0.14;
      // Eye whites
      ctx.fillStyle = T.wormEyeWhite;
      ctx.beginPath();
      ctx.arc(bodyWidth * 0.10, -bodyWidth * 0.22, eyeR, 0, Math.PI * 2);
      ctx.arc(bodyWidth * 0.10,  bodyWidth * 0.22, eyeR, 0, Math.PI * 2);
      ctx.fill();
      // Pupils
      ctx.fillStyle = T.wormEyeColor;
      ctx.beginPath();
      ctx.arc(bodyWidth * 0.13, -bodyWidth * 0.22, eyeR * 0.55, 0, Math.PI * 2);
      ctx.arc(bodyWidth * 0.13,  bodyWidth * 0.22, eyeR * 0.55, 0, Math.PI * 2);
      ctx.fill();
      // Slit if eye color is bright
      if (T.wormEyeColor !== '#000000') {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(bodyWidth * 0.13, -bodyWidth * 0.30);
        ctx.lineTo(bodyWidth * 0.13, -bodyWidth * 0.14);
        ctx.moveTo(bodyWidth * 0.13,  bodyWidth * 0.14);
        ctx.lineTo(bodyWidth * 0.13,  bodyWidth * 0.30);
        ctx.stroke();
      }

      // Tongue flick (occasional)
      const flick = Math.sin(time * 0.0032);
      if (flick > 0.7) {
        const extend = (flick - 0.7) / 0.3;
        ctx.strokeStyle = '#ff2266';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(bodyWidth * 0.45, 0);
        ctx.lineTo(bodyWidth * 0.55 + extend * 6, -1.5);
        ctx.moveTo(bodyWidth * 0.45, 0);
        ctx.lineTo(bodyWidth * 0.55 + extend * 6,  1.5);
        ctx.stroke();
      }

      ctx.restore();
    }

    function getBBox(points) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      return { minX, minY, maxX, maxY };
    }

    // ================= COLOR UTILS =================
    // parseColor handles both '#rrggbb' AND 'rgb(r,g,b)' formats,
    // so lightenColor/darkenColor can safely take lerpColor's output.
    function parseColor(str) {
      if (str.startsWith('#')) {
        return [
          parseInt(str.slice(1,3),16),
          parseInt(str.slice(3,5),16),
          parseInt(str.slice(5,7),16),
        ];
      }
      const m = str.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (m) return [parseInt(m[1],10), parseInt(m[2],10), parseInt(m[3],10)];
      return [128, 128, 128];
    }
    function toRgb(r, g, b) {
      return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
    }
    function lerpColor(c1, c2, t) {
      const [r1,g1,b1] = parseColor(c1);
      const [r2,g2,b2] = parseColor(c2);
      return toRgb(r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t);
    }
    function lightenColor(color, factor) {
      const [r, g, b] = parseColor(color);
      return toRgb(r + (255-r)*factor, g + (255-g)*factor, b + (255-b)*factor);
    }
    function darkenColor(color, factor) {
      const [r, g, b] = parseColor(color);
      return toRgb(r*(1-factor), g*(1-factor), b*(1-factor));
    }

    // ================= MAIN LOOP =================
    let lastTime = performance.now();
    function loop(time) {
      const dt = Math.min(50, time - lastTime);
      lastTime = time;

      if (game.state !== 'playing') game.overOffTime += dt;

      updateDrift(dt);
      updateApple(dt);
      updateParticles(dt);

      if (game.state === 'playing') {
        worm.tickTimer += dt;
        worm.interpolation = Math.min(1, worm.tickTimer / worm.tickInterval);
        while (worm.tickTimer >= worm.tickInterval && game.state === 'playing') {
          worm.tickTimer -= worm.tickInterval;
          worm.interpolation = 0;
          doTick();
        }
      }

      renderBackground(time);
      renderApple(time);

      if (game.state === 'dead') {
        // Fade worm during death
        const t = Math.min(1, game.overOffTime / 400);
        ctx.save();
        ctx.globalAlpha = 1 - t;
        renderWorm(time);
        ctx.restore();
      } else {
        renderWorm(time);
      }

      renderParticles();

      requestAnimationFrame(loop);
    }

    // ================= INIT =================
    initWorm();
    spawnApple();
    updateTickInterval();
    updateScoreDisplay();
    updateLengthDisplay();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
