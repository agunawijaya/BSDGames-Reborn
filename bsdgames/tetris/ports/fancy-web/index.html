<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris: Broken Well — POC</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- STARTUP / SETTINGS SCREEN -->
    <section id="setupScreen" class="screen active">
      <div class="panel">
        <h1>Tetris: Broken Well</h1>
        <p class="tagline">Board bebas bentuk. Stack acak. Main sesuka hatimu.</p>

        <div class="form">
          <div class="field">
            <label for="presetSelect">Preset Board</label>
            <select id="presetSelect">
              <option value="normal">Normal (10×20)</option>
              <option value="tower">Tower (6×30)</option>
              <option value="canyon">Canyon (4 kolom tengah)</option>
              <option value="wide">Wide Well (20×16)</option>
              <option value="split">The Split (2 sumur)</option>
              <option value="hourglass">Hourglass</option>
              <option value="donut">Donut</option>
              <option value="staircase">Staircase</option>
            </select>
          </div>

          <div class="field row">
            <div>
              <label for="boardWidth">Lebar</label>
              <input id="boardWidth" type="number" min="4" max="30" value="10" />
            </div>
            <div>
              <label for="boardHeight">Tinggi</label>
              <input id="boardHeight" type="number" min="10" max="40" value="20" />
            </div>
          </div>

          <div class="field">
            <label for="garbageHeight">Tinggi Starting Stack</label>
            <input id="garbageHeight" type="range" min="0" max="15" value="5" />
            <span class="value" id="garbageHeightVal">5</span>
          </div>

          <div class="field">
            <label for="garbageDensity">Kerapatan Lubang Stack</label>
            <input id="garbageDensity" type="range" min="0" max="80" value="30" />
            <span class="value" id="garbageDensityVal">30%</span>
          </div>

          <div class="field">
            <label for="modeSelect">Mode</label>
            <select id="modeSelect">
              <option value="marathon">Marathon</option>
              <option value="survival">Survival (garbage naik)</option>
            </select>
          </div>

          <div class="field">
            <label for="startLevel">Level Mulai</label>
            <input id="startLevel" type="number" min="1" max="15" value="1" />
          </div>

          <button id="startBtn" class="primary">Mulai Permainan</button>
        </div>

        <div class="help">
          <strong>Kontrol:</strong> ← → geser · ↥ putar · ↓ jatuh cepat · Spasi hard drop · P pause
        </div>
      </div>
    </section>

    <!-- GAME SCREEN -->
    <section id="gameScreen" class="screen">
      <div class="hud">
        <div class="hud-block">
          <div class="hud-label">Mode</div>
          <div class="hud-value" id="hudMode">Marathon</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">Level</div>
          <div class="hud-value" id="hudLevel">1</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">Lines</div>
          <div class="hud-value" id="hudLines">0</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">Score</div>
          <div class="hud-value" id="hudScore">0</div>
        </div>
        <button id="backBtn" class="secondary">Kembali</button>
      </div>

      <div class="game-area">
        <div class="side-panel">
          <div class="side-label">Next</div>
          <canvas id="nextCanvas" width="100" height="100"></canvas>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-content">
            <h2 id="overlayTitle">Game Over</h2>
            <p id="overlayText">Score: 0</p>
            <button id="restartBtn" class="primary">Main Lagi</button>
            <button id="menuBtn" class="secondary">Menu</button>
          </div>
        </div>
      </div>

      <div class="touch-controls">
        <button class="touch-btn" data-action="left">←</button>
        <button class="touch-btn" data-action="rotate">↻</button>
        <button class="touch-btn" data-action="down">↓</button>
        <button class="touch-btn" data-action="drop">⤓</button>
        <button class="touch-btn" data-action="right">→</button>
        <button class="touch-btn" data-action="pause">⏸</button>
      </div>
    </section>
  </div>

  <script src="src/settings.js"></script>
  <script src="src/game.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const settings = new Settings();
      const game = new Game(settings);

      document.getElementById('startBtn').addEventListener('click', () => game.start());
      document.getElementById('restartBtn').addEventListener('click', () => game.start());
      document.getElementById('backBtn').addEventListener('click', () => game.showMenu());
      document.getElementById('menuBtn').addEventListener('click', () => game.showMenu());
    });
  </script>
</body>
</html>
